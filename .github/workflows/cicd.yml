name: DEMO-CICD

on:
  push:
    branches:
      - main

jobs:

  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  gitleaks:
    name: Gitleaks Scan
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: HTML Lint
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes htmlhint@1 --config .htmlhintrc index.html error.html

  unit-test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_html.sh

  docker-build:
    name: Docker Build and Push (${{ matrix.suffix }})
    needs: unit-test
    runs-on: ubuntu-latest

    # Runs this job twice, once per architecture
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd
          - platform: linux/arm64
            suffix: arm

    env:
      IMAGE: aakansh/frontend
      REVISION: ${{ github.run_number }} 

    steps:
      - uses: actions/checkout@v4

      # Creates today's date like 2026-10-07 for the tag
      - name: Create tag date
        run: echo "TAG_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.suffix }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false      # keeps each tag a plain single image
          sbom: false
          tags: ${{ env.IMAGE }}:latest-${{ env.TAG_DATE }}.${{ env.REVISION }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
