name: DEMO-CICD

on:
  push:
    branches:
      - main

jobs:

  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  gitleaks:
    name: Gitleaks Scan
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: HTML Lint
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes htmlhint@1 --config .htmlhintrc index.html error.html

  unit-test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_html.sh

  # NEW: works out today's date and the next revision number (.1, .2, .3 ...)
  prepare-tag:
    name: Create Image Tag
    needs: unit-test
    runs-on: ubuntu-latest

    # Values that the next jobs can read
    outputs:
      tag_date: ${{ steps.tag.outputs.tag_date }}
      revision: ${{ steps.tag.outputs.revision }}

    steps:
      - name: Work out date and next revision
        id: tag
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          # Today's date (UTC), like 2026-10-08
          DATE=$(date -u +%Y-%m-%d)

          # Log in to the Docker Hub API to get a short-lived token
          JWT=$(jq -n --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username:$u,password:$p}' \
            | curl -s -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/users/login \
            | jq -r '.token // empty')

          if [ -z "$JWT" ]; then
            echo "Could not log in to Docker Hub. Check DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi

          # Look through the existing tags for today and find the highest number
          MAX=0
          URL="https://hub.docker.com/v2/repositories/$DH_USER/frontend/tags?page_size=100&name=latest-$DATE"

          while [ -n "$URL" ]; do
            RESP=$(curl -s -H "Authorization: JWT $JWT" "$URL")

            for NAME in $(echo "$RESP" | jq -r '.results[]?.name'); do
              if [[ "$NAME" =~ ^latest-${DATE}\.([0-9]+)-(amd|arm)$ ]]; then
                NUM="${BASH_REMATCH[1]}"
                if [ "$NUM" -gt "$MAX" ]; then
                  MAX="$NUM"
                fi
              fi
            done

            URL=$(echo "$RESP" | jq -r '.next // empty')
          done

          # Next revision is the highest found plus 1 (starts at 1 if none exist)
          REVISION=$((MAX + 1))

          echo "tag_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Next tag will be: latest-$DATE.$REVISION-amd and latest-$DATE.$REVISION-arm"

  docker-build:
    name: Docker Build and Push (${{ matrix.suffix }})
    needs: prepare-tag
    runs-on: ubuntu-latest

    # Runs this job twice, once per architecture
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd
          - platform: linux/arm64
            suffix: arm

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend
      TAG_DATE: ${{ needs.prepare-tag.outputs.tag_date }}
      REVISION: ${{ needs.prepare-tag.outputs.revision }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.suffix }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:latest-${{ env.TAG_DATE }}.${{ env.REVISION }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
